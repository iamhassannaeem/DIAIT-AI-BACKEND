<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Phone Number</title>
</head>
<body>
    <h1>Select Phone Number</h1>
    <form method="post">
        {% csrf_token %}

        <label for="phone_number">Phone Number:</label>
        <select id="phone_number" name="phone_number" required>
            {% for phone_number in phone_numbers %}
                <option value="{{ phone_number.phone_number }}">{{ phone_number.phone_number }}</option>
            {% endfor %}
        </select><br><br>

        <button type="submit">Save Phone Number</button>
    </form>
</body>
</html>
